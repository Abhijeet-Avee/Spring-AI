server:
 port: 8081

spring:
 application:
  name: help-desk-backend
 #DB configuration for POSTGRES
 datasource:
  url: jdbc:postgresql://localhost:5434/postgres
  username: postgres
  password: yashavee
 #JPA configuration
 jpa:
  hibernate:
   ddl-auto: update
  show-sql: true
  properties:
   hibernate:
    dialect: org.hibernate.dialect.PostgreSQLDialect
  open-in-view: false
 #Disable auto-chat client configuration
 ai:
  chat:
   client:
    enabled: false
  ollama:
   base-url: http://localhost:11434
   chat:
    options:
     model: llama3.2:latest
     temperature: 0.1
     num_ctx: 16000
   memory:
    repository:
     jdbc:
      initialize-schema: ALWAYS  
      
# Logging configuration
logging:
 level:
  org:
   springframework:
    ai:
     chat:
      client:
       advisor: DEBUG 