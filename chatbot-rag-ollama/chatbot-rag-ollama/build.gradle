plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.spring.ollama'
version = '0.0.1-SNAPSHOT'
description = 'This is first project for Spring and AI communication using Ollama'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springAiVersion', "1.0.1")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	
	// Spring AI core dependency - ollama model
	implementation 'org.springframework.ai:spring-ai-starter-model-ollama'
	
	// chat memory dependencies - jdbc and postgresql
	implementation 'org.springframework.ai:spring-ai-starter-model-chat-memory-repository-jdbc'
	runtimeOnly 'org.postgresql:postgresql'
	
	// vector store dependencies -  mariadb
	//implementation 'org.springframework.ai:spring-ai-starter-vector-store-mariadb'
	//runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
	
	// vector store dependencies -  postgresql
	implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'
	
	
	// RAG and advisors dependencies
	implementation 'org.springframework.ai:spring-ai-advisors-vector-store'
	implementation 'org.springframework.ai:spring-ai-rag'	
	
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
