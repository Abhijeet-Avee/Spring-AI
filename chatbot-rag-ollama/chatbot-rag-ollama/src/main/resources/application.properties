spring.application.name=chatbot-demo-ollama
server.port=8081

#Disable auto-chat client configuration
spring.ai.chat.client.enabled=false

# Logging configuration
logging.level.org.springframework.ai.chat.client.advisor=DEBUG

# Ollama Chat Model configuration
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3:latest
spring.ai.ollama.chat.options.temperature=0.7

# Ollama Embedding Model configuration
spring.ai.ollama.embedding.enabled=true  
spring.ai.ollama.embedding.options.model=mxbai-embed-large:latest

#default embedding model for ollama is mxbaise-embed-text [dimension 1024]
#other options are nomic-embed-text:latest [dimension 768], embeddingGemma [dimension 768]

